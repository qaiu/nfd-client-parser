name: build

# PRs and pushes build every package and upload it as an Actions artifact.
# A tag vX.Y.Z (matching VERSION) also publishes those files to a GitHub Release;
# vX.Y.Z-anything (for example v0.2.0-rc.1) creates a draft prerelease instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must be X.Y.Z, got '$version'"; exit 1; }
          grep -q "<revision>$version</revision>" desktop/pom.xml \
            || { echo "::error::desktop/pom.xml <revision> differs from VERSION ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            case "${tag#v}" in
              "$version") echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
              "$version"-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::tag $tag does not match VERSION $version"; exit 1 ;;
            esac
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$version tag=${tag:-none}"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.NFD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NFD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NFD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NFD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No NFD_KEYSTORE_BASE64 secret: APKs are signed with the debug key (fine for testing, not for distribution)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "NFD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NFD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NFD_KEY_ALIAS=$KEY_ALIAS"
            echo "NFD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon -PappVersion="$VERSION" :core:test :daemon:test :app:testDebugUnitTest :app:assembleRelease :daemon:daemonDist
      - name: Collect and check packages
        run: |
          set -euo pipefail
          mkdir -p dist
          out=android/app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            cp "$out/app-$abi-release.apk" "dist/nfd-android-$VERSION-$abi.apk"
          done
          cp "android/daemon/build/dist/nfd-termux-daemon-$VERSION.tar.gz" dist/
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in dist/*.apk; do
            unzip -p "$apk" assets/termux/nfd-termux-daemon.tgz > bundle.tgz \
              || { echo "::error::$apk lacks the daemon bundle"; exit 1; }
            listing="$(tar -tzf bundle.tgz)"
            grep -qx 'nfd-termux/bin/nfd-termux' <<<"$listing" || { echo "::error::$apk has a broken daemon bundle"; exit 1; }
            "$apksigner" verify "$apk"
          done
          arm64="$(unzip -l "dist/nfd-android-$VERSION-arm64-v8a.apk")"
          grep -q 'lib/arm64-v8a/' <<<"$arm64" || { echo "::error::arm64 APK has no arm64 libs"; exit 1; }
          if grep -q 'lib/x86_64/' <<<"$arm64"; then echo "::error::arm64 APK contains other ABIs"; exit 1; fi
          "$apksigner" verify --print-certs "dist/nfd-android-$VERSION-universal.apk"
          rm -f bundle.tgz
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: termux-daemon
          path: dist/*.tar.gz
          if-no-files-found: error

  termux:
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: termux (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termux-daemon
          path: ci
      - name: Termux OpenJDK + daemon in termux-docker
        run: |
          cp termux/ci/termux-smoke.sh ci/
          chmod -R a+rX ci
          bundle="$(cd ci && ls nfd-termux-daemon-*.tar.gz)"
          docker run --rm -v "$PWD/ci:/mnt/ci:ro" "termux/termux-docker:${{ matrix.arch }}" \
            bash /mnt/ci/termux-smoke.sh "/mnt/ci/$bundle"
      - name: Live parse from Termux (network dependent, informational)
        continue-on-error: true
        run: |
          bundle="$(cd ci && ls nfd-termux-daemon-*.tar.gz)"
          docker run --rm -v "$PWD/ci:/mnt/ci:ro" "termux/termux-docker:${{ matrix.arch }}" \
            bash /mnt/ci/termux-smoke.sh "/mnt/ci/$bundle" --online

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-14
          - name: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    name: desktop (${{ matrix.name }})
    env:
      NFD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: WiX 3 for the .msi (best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH $wix.FullName }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot
      - name: Test, package and self-test
        shell: bash
        run: desktop/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/target/dist/NFDClient-*.zip
            desktop/target/dist/NFDClient-*.tar.gz
            desktop/target/dist/NFDClient-*.msi
            desktop/target/dist/NFDClient-*.deb
            desktop/target/dist/NFDClient-*.dmg
          if-no-files-found: error

  windows-arm64:
    # JavaFX publishes no win-aarch64 natives, so Windows on Arm runs the x64 build under emulation.
    needs: desktop
    runs-on: windows-11-arm
    name: desktop (windows-arm64 via x64 emulation)
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: pkg
      - name: Self-test the x64 package on Windows on Arm
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter "NFDClient-*-windows-x64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          $p = Start-Process -FilePath "app\NFDClient\NFDClient.exe" -ArgumentList "--self-test","--report","$PWD\report.txt" -Wait -PassThru
          Get-Content report.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path report.txt -Pattern "SELF-TEST OK" -Quiet)) { exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, termux, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          NFD Client $VERSION（parser 10.2.6）。安装说明与架构对照见 README。

          - Android：按 CPU 选择 \`nfd-android-$VERSION-<abi>.apk\`，不确定就装 \`universal\`。解析与下载由 Termux 中的守护进程完成，首次使用请在 App 的「连接」页按提示安装。
          - Termux 守护进程：\`nfd-termux-daemon-$VERSION.tar.gz\`（App 内已内置，单独下载仅用于手动安装）。
          - 桌面：\`NFDClient-$VERSION-<os>-<arch>\`，自带 Java 运行时，无需另装 Java。macOS 包未签名，Windows 包未签名。
          - 校验：\`SHA256SUMS.txt\`。
          EOF
      - name: Publish
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--draft --prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "NFD Client $TAG" --notes-file notes.md "${flags[@]}"
          fi
